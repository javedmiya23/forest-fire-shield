<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="120" y1="60" x2="1500" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041116"/>
      <stop offset="0.55" stop-color="#071820"/>
      <stop offset="1" stop-color="#0B1318"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 180) rotate(33) scale(420 380)">
      <stop stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320 180) rotate(15) scale(420 340)">
      <stop stop-color="#FB923C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="120" y1="120" x2="1480" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1A22" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A141B" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="70" y1="120" x2="1530" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#E2E8F0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="backendHeader" x1="330" y1="370" x2="1270" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-50" y="-50" width="1700" height="1080" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12L3.3 6L0 0Z" fill="#F8FAFC"/>
    </marker>
    <marker id="arrowWarm" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12L3.3 6L0 0Z" fill="#FDBA74"/>
    </marker>
    <marker id="arrowCool" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12L3.3 6L0 0Z" fill="#67E8F9"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: rgba(231,229,228,0.82); letter-spacing: 0.08em; text-transform: uppercase; }
      .section-label { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #FDE68A; letter-spacing: 0.28em; text-transform: uppercase; }
      .card-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .card-subtitle { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: rgba(214,211,209,0.76); }
      .mini-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .mini-copy { font: 500 12.5px 'Segoe UI', Arial, sans-serif; fill: rgba(226,232,240,0.82); }
      .bullet { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: rgba(241,245,249,0.88); }
      .tiny { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: rgba(251,191,36,0.86); letter-spacing: 0.18em; text-transform: uppercase; }
      .label { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: rgba(226,232,240,0.8); }
      .flow { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #E2E8F0; }
      .muted-flow { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: rgba(226,232,240,0.72); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bgGradient)"/>
  <rect width="1600" height="980" fill="url(#glowLeft)"/>
  <rect width="1600" height="980" fill="url(#glowRight)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="118" width="1490" height="812" rx="34" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  </g>

  <text x="84" y="70" class="subtitle">Forest Fire Shield // System Workflow</text>
  <text x="82" y="112" class="title">End-to-End Architecture and Data Flow</text>
  <text x="84" y="145" class="card-subtitle">Single-forest, single-ESP32 wildfire intelligence pipeline with GIS, automation, simulation, analysis, alerts, and reporting.</text>

  <g>
    <rect x="80" y="178" width="290" height="188" rx="28" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <text x="108" y="214" class="section-label">Hardware</text>
    <text x="108" y="250" class="card-title">ESP32 Sensor Node</text>
    <text x="108" y="278" class="card-subtitle">Live wildfire detection hardware</text>
    <text x="108" y="314" class="bullet">MQ2 / MQ4 / MQ7 / MQ135</text>
    <text x="108" y="340" class="bullet">Flame sensor + IR sensor</text>
    <text x="108" y="366" class="bullet">Wi-Fi JSON packets every 3-5 s</text>
  </g>

  <g>
    <rect x="430" y="178" width="320" height="188" rx="28" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <text x="458" y="214" class="section-label">Forest Input</text>
    <text x="458" y="250" class="card-title">GeoJSON + Forest Builder</text>
    <text x="458" y="278" class="card-subtitle">Map context and ecological metadata</text>
    <text x="458" y="314" class="bullet">Upload GeoJSON or create map manually</text>
    <text x="458" y="340" class="bullet">Boundary, sensor point, vegetation, fuel</text>
    <text x="458" y="366" class="bullet">Water, roads, firebreaks, habitats</text>
  </g>

  <g>
    <rect x="1190" y="158" width="330" height="220" rx="30" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <text x="1218" y="194" class="section-label">External Services</text>
    <rect x="1216" y="222" width="132" height="126" rx="22" fill="rgba(8,21,29,0.76)" stroke="rgba(125,211,252,0.18)"/>
    <text x="1236" y="253" class="tiny">Weather</text>
    <text x="1236" y="283" class="mini-title">Open-Meteo</text>
    <text x="1236" y="311" class="mini-copy">temperature</text>
    <text x="1236" y="331" class="mini-copy">humidity</text>
    <text x="1236" y="351" class="mini-copy">wind + rain</text>

    <rect x="1372" y="222" width="122" height="126" rx="22" fill="rgba(8,21,29,0.76)" stroke="rgba(251,191,36,0.18)"/>
    <text x="1392" y="253" class="tiny">Alerts</text>
    <text x="1392" y="283" class="mini-title">SMTP Mail</text>
    <text x="1392" y="311" class="mini-copy">fire alert</text>
    <text x="1392" y="331" class="mini-copy">dispatch note</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="406" width="940" height="312" rx="34" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <rect x="330" y="406" width="940" height="64" rx="34" fill="url(#backendHeader)"/>
    <text x="364" y="448" class="section-label">Backend Intelligence Hub</text>
    <text x="742" y="448" class="label">FastAPI APIs, event logic, scheduled jobs, simulation, reporting</text>
  </g>

  <g>
    <rect x="388" y="496" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="410" y="528" class="mini-title">Forest Service</text>
    <text x="410" y="553" class="mini-copy">GeoJSON validation</text>
    <text x="410" y="573" class="mini-copy">boundary + sensor linking</text>

    <rect x="680" y="496" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="702" y="528" class="mini-title">Ingestion API</text>
    <text x="702" y="553" class="mini-copy">ESP32 packet intake</text>
    <text x="702" y="573" class="mini-copy">severity + heartbeat</text>

    <rect x="972" y="496" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="994" y="528" class="mini-title">Fire Event Service</text>
    <text x="994" y="553" class="mini-copy">open / update / resolve</text>
    <text x="994" y="573" class="mini-copy">email trigger logic</text>

    <rect x="388" y="612" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="410" y="644" class="mini-title">Weather Service</text>
    <text x="410" y="669" class="mini-copy">API fetch + cache</text>
    <text x="410" y="689" class="mini-copy">sensor point / centroid fallback</text>

    <rect x="680" y="612" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="702" y="644" class="mini-title">Simulation Engine</text>
    <text x="702" y="669" class="mini-copy">grid_v2 barrier-aware</text>
    <text x="702" y="689" class="mini-copy">wind + fuel + moisture</text>

    <rect x="972" y="612" width="240" height="90" rx="22" fill="rgba(8,21,29,0.82)" stroke="rgba(255,255,255,0.1)"/>
    <text x="994" y="644" class="mini-title">Analysis + Reporting</text>
    <text x="994" y="669" class="mini-copy">impact estimate</text>
    <text x="994" y="689" class="mini-copy">PDF export + recommendations</text>

    <rect x="544" y="728" width="512" height="72" rx="22" fill="rgba(4,16,24,0.78)" stroke="rgba(16,185,129,0.24)"/>
    <text x="570" y="758" class="tiny">Automation Worker</text>
    <text x="570" y="785" class="mini-copy">scheduled weather refresh + stale fire cleanup + device status sync</text>
  </g>

  <g>
    <rect x="80" y="786" width="450" height="154" rx="28" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <text x="108" y="822" class="section-label">Spatial Database</text>
    <text x="108" y="858" class="card-title">PostgreSQL + PostGIS</text>
    <text x="108" y="886" class="card-subtitle">Persistent storage for facts, maps, and outputs</text>
    <text x="108" y="917" class="bullet">readings, fire events, uploads, weather cache</text>
    <text x="108" y="943" class="bullet">simulations, hourly polygons, analysis reports</text>
  </g>

  <g>
    <rect x="1000" y="786" width="520" height="154" rx="28" fill="url(#cardFill)" stroke="url(#cardStroke)"/>
    <text x="1028" y="822" class="section-label">Frontend</text>
    <text x="1028" y="858" class="card-title">Angular Control Room</text>
    <text x="1028" y="886" class="card-subtitle">Operator interface and demo layer</text>
    <text x="1028" y="917" class="bullet">Forest Setup, Dashboard, Simulation, Analysis</text>
    <text x="1028" y="943" class="bullet">Map rendering, cinematic reel, PDF/report access</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M370 270C500 270 555 520 680 540" stroke="#F8FAFC" stroke-width="3.2" marker-end="url(#arrow)"/>
    <text x="474" y="350" class="flow">sensor JSON payloads</text>

    <path d="M590 366C590 420 508 458 508 496" stroke="#F8FAFC" stroke-width="3.2" marker-end="url(#arrow)"/>
    <text x="472" y="420" class="flow">GeoJSON + attributes</text>

    <path d="M1120 541H972" stroke="#FDBA74" stroke-width="3.2" marker-end="url(#arrowWarm)"/>
    <text x="1004" y="531" class="muted-flow">event logic</text>

    <path d="M920 541H972" stroke="#F8FAFC" stroke-width="2.8" marker-end="url(#arrow)"/>
    <text x="892" y="531" class="muted-flow">alarm state</text>

    <path d="M508 612V586" stroke="#67E8F9" stroke-width="2.8" marker-end="url(#arrowCool)"/>
    <text x="410" y="607" class="muted-flow">forest location</text>

    <path d="M628 657H680" stroke="#67E8F9" stroke-width="2.8" marker-end="url(#arrowCool)"/>
    <text x="598" y="646" class="muted-flow">weather</text>

    <path d="M1092 586V612" stroke="#FDBA74" stroke-width="2.8" marker-end="url(#arrowWarm)"/>
    <text x="1040" y="606" class="muted-flow">event context</text>

    <path d="M920 657H972" stroke="#F8FAFC" stroke-width="2.8" marker-end="url(#arrow)"/>
    <text x="896" y="646" class="muted-flow">spread output</text>

    <path d="M430 808C560 786 632 752 632 702" stroke="#E2E8F0" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="454" y="770" class="flow">persist + query spatial data</text>

    <path d="M1260 552C1355 552 1412 314 1372 285" stroke="#FDBA74" stroke-width="3.2" marker-end="url(#arrowWarm)"/>
    <text x="1294" y="450" class="muted-flow">alert email</text>

    <path d="M1282 276C1218 276 1216 612 628 657" stroke="#67E8F9" stroke-width="3.2" marker-end="url(#arrowCool)"/>
    <text x="1172" y="386" class="muted-flow">forecast pull</text>

    <path d="M1260 622C1355 622 1260 786 1260 786" stroke="#F8FAFC" stroke-width="3.2" marker-end="url(#arrow)"/>
    <text x="1292" y="735" class="flow">REST APIs + live state</text>

    <path d="M800 728V702" stroke="#10B981" stroke-width="2.8" stroke-dasharray="8 8" marker-end="url(#arrowWarm)"/>
    <path d="M640 728C640 690 520 694 520 702" stroke="#10B981" stroke-width="2.8" stroke-dasharray="8 8" marker-end="url(#arrowWarm)"/>
    <path d="M960 728C960 690 1092 694 1092 702" stroke="#10B981" stroke-width="2.8" stroke-dasharray="8 8" marker-end="url(#arrowWarm)"/>
    <text x="828" y="720" class="muted-flow">scheduled jobs</text>
  </g>

  <g>
    <rect x="82" y="22" width="44" height="44" rx="14" fill="rgba(251,146,60,0.18)" stroke="rgba(251,146,60,0.28)"/>
    <text x="96" y="51" class="mini-title" fill="#FED7AA">FF</text>
  </g>
</svg>
