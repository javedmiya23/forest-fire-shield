services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: forest-fire-shield-postgis
    environment:
      POSTGRES_DB: forest_fire_shield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  observability:
    image: grafana/otel-lgtm:latest
    container_name: forest-fire-shield-observability
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data

volumes:
  postgis_data:
  lgtm_data:
